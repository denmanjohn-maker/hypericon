# Xcode project definition. Generate with `xcodegen generate` (brew install xcodegen).
name: HyperIcon
options:
  bundleIdPrefix: com.hypericon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/HyperIcon.xcconfig
  Release: Config/HyperIcon.xcconfig
packages:
  HyperIconCore:
    path: Core
targets:
  HyperIcon:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      - path: Themes
        type: folder
        buildPhase: resources
    dependencies:
      - package: HyperIconCore
        product: HyperIconCore
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
schemes:
  HyperIcon:
    build:
      targets:
        HyperIcon: all
    run:
      config: Debug
    archive:
      config: Release
